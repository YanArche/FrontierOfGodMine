<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Аккаунт WoidWatch</title><main><h1>Аккаунт WoidWatch</h1><p>Введите ник сообщества. Для регистрации понадобится приглашение.</p><label>Ник <input id="name" autocomplete="username"></label><label>Приглашение <input id="invite" type="password"></label><button id="login">Войти с ключом доступа</button><button id="register">Зарегистрироваться</button><div hidden id="confirm"><p>Введите код, который показывает ваш лаунчер.</p><input id="code" maxlength="6" inputmode="numeric"><button id="approve">Подтвердить вход в лаунчер</button></div><p role="status" id="status"></p></main><script src="/account.js"></script></html>
